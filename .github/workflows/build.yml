name: Build AstraGram

# The full Telegram-iOS build takes longer than one GitHub job may run. The Bazel disk cache is saved after
# every attempt, and an attempt that runs out of time starts the next one itself, which continues from the cache.

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: 'release_arm64 = installable IPA, debug_sim_arm64 = faster compile check'
        type: choice
        options: [release_arm64, debug_sim_arm64]
        default: release_arm64
      attempt:
        description: 'Continuation attempt (set automatically)'
        default: '1'
  push:
    branches: [master]
    paths-ignore:
      - '**.md'
      - 'astragram/scripts/**'
      - 'astragram/uitest/**'
      - 'Telegram/Tests/**'
      - '.github/workflows/ui-test.yml'

concurrency:
  group: build-${{ github.ref }}-${{ inputs.configuration || 'release_arm64' }}
  cancel-in-progress: false

# Actions are pinned to full commit SHAs. The build job runs a lot of third-party build code, so it cannot write to the
# repository; only the small publish job below, which runs no build code, can create a release.
permissions:
  contents: read

env:
  SOURCE_DIR: /Users/Shared/telegram-ios
  CACHE_DIR: /Users/Shared/bazel-cache
  BAZEL_USER_ROOT: /private/var/tmp/_bazel_containerhost
  CONFIGURATION: ${{ inputs.configuration || 'release_arm64' }}
  ATTEMPT: ${{ inputs.attempt || '1' }}
  MAX_ATTEMPTS: '6'

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 355
    permissions:
      contents: read
      actions: write   # starting the next attempt
    outputs:
      app_version: ${{ steps.build.outputs.app_version }}
      build_number: ${{ steps.build.outputs.build_number }}
      ipa_ready: ${{ steps.collect.outputs.ipa_ready }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Free disk space
        run: |
          df -h /
          XCODE_VERSION=$(python3 -c 'import json;print(json.load(open("versions.json"))["xcode"])')
          for x in /Applications/Xcode_*.app; do
            case "$x" in
              /Applications/Xcode_${XCODE_VERSION}.app|/Applications/Xcode_${XCODE_VERSION}.0.app) ;;
              *) [ -L "$x" ] || sudo rm -rf "$x" & ;;
            esac
          done
          sudo rm -rf ~/Library/Android /usr/local/share/dotnet ~/.dotnet ~/Library/Developer/CoreSimulator/Caches &
          wait
          df -h /

      - name: Select Xcode
        run: |
          XCODE_VERSION=$(python3 -c 'import json;print(json.load(open("versions.json"))["xcode"])')
          sudo xcode-select -s /Applications/Xcode_$XCODE_VERSION.app/Contents/Developer
          xcodebuild -version
          echo "cpus=$(sysctl -n hw.ncpu) memory=$(( $(sysctl -n hw.memsize) / 1073741824 ))GB"

      - name: Restore Bazel cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.CACHE_DIR }}
          key: bazel-${{ env.CONFIGURATION }}-${{ github.sha }}-${{ github.run_id }}
          restore-keys: |
            bazel-${{ env.CONFIGURATION }}-${{ github.sha }}-
            bazel-${{ env.CONFIGURATION }}-

      - name: Prepare canonical source directory
        run: |
          sudo mkdir -p /Users/Shared "$CACHE_DIR"
          sudo chown -R "$(whoami)" /Users/Shared
          rsync -a --delete "$GITHUB_WORKSPACE/" "$SOURCE_DIR/"
          du -sh "$CACHE_DIR" || true

      # No API credentials are built in: every user enters their own API ID and hash in the app on the first launch.
      - name: Generate configuration
        run: |
          mkdir -p "$SOURCE_DIR/build-input"
          python3 astragram/ci/make_configuration.py "$SOURCE_DIR/build-input/astragram-configuration.json"

      - name: Build
        id: build
        run: |
          set -uo pipefail
          cd "$SOURCE_DIR"
          APP_VERSION=$(python3 -c 'import json;print(json.load(open("versions.json"))["app"])')
          BUILD_NUMBER=$(( $(cat build_number_offset) + 100000 + ${{ github.run_number }} ))
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          echo "app_version=$APP_VERSION" >> "$GITHUB_OUTPUT"
          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"

          # The fake provisioning profiles in the repository have expired: re-sign them with a future date.
          python3 astragram/ci/refresh_profiles.py "$SOURCE_DIR" || exit 1
          python3 build-system/Make/ImportCertificates.py --path build-system/fake-codesigning/certs

          # Make.py ignores --bazelArguments, so resource limits go into the CI copy's .bazelrc.
          printf '\nbuild --local_resources=memory=HOST_RAM*.85\nbuild --jobs=%s\n' "$(sysctl -n hw.ncpu)" >> .bazelrc

          # Stop in time to save the cache (the job limit is 6 hours).
          python3 astragram/ci/run_with_timeout.py 17100 -- python3 -u build-system/Make/Make.py \
            --bazelUserRoot="$BAZEL_USER_ROOT" \
            --cacheDir="$CACHE_DIR" \
            build \
            --continueOnError \
            --configurationPath="build-input/astragram-configuration.json" \
            --codesigningInformationPath=build-system/fake-codesigning \
            --configuration="$CONFIGURATION" \
            --buildNumber="$BUILD_NUMBER" 2>&1 | tee build.log
          STATUS=${PIPESTATUS[0]}
          echo "exit status $STATUS"
          if [ "$STATUS" = "124" ] || [ "$STATUS" = "137" ]; then
            echo "timed_out=true" >> "$GITHUB_OUTPUT"
          fi
          exit $STATUS

      - name: Errors summary
        if: failure()
        run: grep -E "error:|ERROR:" "$SOURCE_DIR/build.log" | sort -u | head -n 120 || true

      - name: Save Bazel cache
        if: always() && steps.build.outcome != 'skipped'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.CACHE_DIR }}
          key: bazel-${{ env.CONFIGURATION }}-${{ github.sha }}-${{ github.run_id }}

      - name: Continue in a new job
        if: always() && steps.build.outputs.timed_out == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "$ATTEMPT" -ge "$MAX_ATTEMPTS" ]; then
            echo "Reached $MAX_ATTEMPTS attempts, not continuing."
            exit 0
          fi
          gh workflow run build.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" \
            -f configuration="$CONFIGURATION" -f attempt=$(( ATTEMPT + 1 ))
          echo "Started attempt $(( ATTEMPT + 1 ))."

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: build-log-${{ github.run_id }}
          path: ${{ env.SOURCE_DIR }}/build.log
          if-no-files-found: ignore

      - name: Collect IPA
        id: collect
        if: steps.build.outcome == 'success' && env.CONFIGURATION == 'release_arm64'
        run: |
          set -euo pipefail
          cd "$SOURCE_DIR"
          mkdir -p "$GITHUB_WORKSPACE/out"
          IPA=bazel-bin/Telegram/Telegram.ipa
          if [ ! -f "$IPA" ]; then
            IPA=$(find -L bazel-out -path '*/bin/Telegram/Telegram.ipa' -type f 2>/dev/null | head -1)
          fi
          if [ -z "$IPA" ] || [ ! -f "$IPA" ]; then
            echo "::error::Telegram.ipa not found"
            exit 1
          fi
          echo "IPA: $IPA"
          cp -L "$IPA" "$GITHUB_WORKSPACE/out/AstraGram.ipa"
          python3 astragram/ci/verify_ipa.py "$GITHUB_WORKSPACE/out/AstraGram.ipa"
          echo "ipa_ready=true" >> "$GITHUB_OUTPUT"

      - name: Upload IPA
        if: steps.build.outcome == 'success' && env.CONFIGURATION == 'release_arm64'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: AstraGram-${{ env.APP_VERSION }}-${{ env.BUILD_NUMBER }}
          path: out/AstraGram.ipa
          if-no-files-found: error
          retention-days: 30

  # A GitHub release with the IPA (the app checks it for updates) and the SideStore source that lists it.
  publish:
    needs: build
    if: needs.build.outputs.ipa_ready == 'true' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1

      - name: Download IPA
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: AstraGram-${{ needs.build.outputs.app_version }}-${{ needs.build.outputs.build_number }}
          path: out

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 astragram/ci/publish_release.py out/AstraGram.ipa "${{ needs.build.outputs.app_version }}" "${{ needs.build.outputs.build_number }}"
