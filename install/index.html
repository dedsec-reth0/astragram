<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Установка AstraGram</title>
<meta name="description" content="Добавить источник AstraGram в AltStore или SideStore, или скачать IPA.">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<link rel="icon" href="../icon.png">
<link rel="apple-touch-icon" href="../icon.png">
<style>
:root{
 --bg:#000;--text:#f5f5f7;--muted:rgba(245,245,247,.62);--faint:rgba(245,245,247,.36);
 --glass:rgba(255,255,255,.06);--glass-2:rgba(255,255,255,.1);--edge:rgba(255,255,255,.12);--edge-top:rgba(255,255,255,.28);
 --display:"SF Pro Display",-apple-system,BlinkMacSystemFont,"Inter Display","Inter",system-ui,sans-serif;
 --body:"SF Pro Text",-apple-system,BlinkMacSystemFont,"Inter",system-ui,sans-serif;
 --mono:ui-monospace,SFMono-Regular,Menlo,"DejaVu Sans Mono",monospace;
 --ease:cubic-bezier(.16,1,.3,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg);scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--body);-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit;text-decoration:none}
::selection{background:rgba(255,255,255,.9);color:#000}
#gl{position:fixed;inset:0;width:100%;height:100%;z-index:0;display:block}
#glFallback{position:fixed;inset:0;z-index:0;display:none;background:radial-gradient(40vmax 40vmax at 70% 25%,rgba(139,92,246,.25),transparent 70%),radial-gradient(35vmax 35vmax at 30% 70%,rgba(56,189,248,.16),transparent 70%)}
.vignette{position:fixed;inset:0;z-index:1;pointer-events:none;background:radial-gradient(ellipse at 50% 40%,transparent 40%,rgba(0,0,0,.78) 100%)}
.grain{position:fixed;inset:-50%;z-index:2;pointer-events:none;opacity:.06;
 background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");animation:grain 1.2s steps(6) infinite}
@keyframes grain{0%{transform:translate(0,0)}20%{transform:translate(-3%,2%)}40%{transform:translate(2%,-3%)}60%{transform:translate(-2%,-1%)}80%{transform:translate(3%,1%)}100%{transform:translate(0,0)}}

.glass{position:relative;background:var(--glass);-webkit-backdrop-filter:blur(24px) saturate(160%);backdrop-filter:blur(24px) saturate(160%);box-shadow:inset 0 1px 0 var(--edge-top),inset 0 0 0 1px var(--edge)}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(160deg,rgba(255,255,255,.12),rgba(255,255,255,.015) 40%,transparent 62%)}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.glass{background:rgba(32,32,36,.92)}}

nav{position:fixed;z-index:50;left:50%;top:calc(env(safe-area-inset-top) + 14px);transform:translateX(-50%);display:flex;align-items:center;gap:4px;padding:6px;border-radius:999px;width:max-content;max-width:calc(100vw - 24px)}
nav .brand{display:flex;align-items:center;gap:10px;padding:4px 14px 4px 4px;font-weight:700;font-family:var(--display);letter-spacing:-.01em}
nav .brand img{width:34px;height:34px;border-radius:9px}
nav .gh{display:flex;align-items:center;gap:8px;padding:10px 16px;border-radius:999px;background:#fff;color:#000;font-weight:650;font-size:14px}
nav .gh svg{width:16px;height:16px}
.lang{position:relative}
.lang-btn{display:flex;align-items:center;gap:6px;height:40px;padding:0 12px;border-radius:999px;border:0;background:transparent;color:var(--muted);font:600 13px var(--body);cursor:pointer;transition:color .25s,background-color .25s}
.lang-btn:hover,.lang-btn[aria-expanded=true]{color:#fff;background:rgba(255,255,255,.07)}
.lang-btn svg{width:17px;height:17px}
.lang-menu{position:absolute;right:0;top:calc(100% + 10px);min-width:200px;padding:6px;border-radius:20px;display:grid;gap:2px;background:rgba(20,20,24,.72);opacity:0;visibility:hidden;transform:translateY(-6px) scale(.98);transform-origin:top right;transition:opacity .25s var(--ease),transform .35s var(--ease),visibility .25s}
.lang-menu.open{opacity:1;visibility:visible;transform:none}
.lang-menu button{display:flex;align-items:center;gap:12px;height:42px;padding:0 12px;border-radius:14px;border:0;background:transparent;color:rgba(245,245,247,.85);font:500 15px var(--body);cursor:pointer;text-align:left}
.lang-menu button b{width:26px;font:700 11px var(--mono);color:var(--faint)}
.lang-menu button:hover{background:rgba(255,255,255,.08);color:#fff}
.lang-menu button.on{background:#fff;color:#000}.lang-menu button.on b{color:rgba(0,0,0,.5)}
@media (max-width:420px){nav .brand{padding-right:6px}.lang-btn{padding:0 8px}nav .gh span{display:none}nav .gh{padding:10px 12px}}

main{position:relative;z-index:3;max-width:1180px;margin:0 auto;padding:0 clamp(16px,5vw,64px)}
.eyebrow{font:600 13px/1 var(--body);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
.grad{background:linear-gradient(100deg,#fff 0%,#d9d2ff 40%,#a5e4ff 75%,#fff 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.h2{font:700 clamp(38px,5.6vw,80px)/1 var(--display);letter-spacing:-.045em;margin:14px 0 0}

/* hero */
.hero{min-height:100vh;min-height:100svh;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:clamp(24px,4vw,64px);align-items:center;padding:calc(env(safe-area-inset-top) + 110px) 0 80px}
@media (max-width:900px){.hero{grid-template-columns:1fr;padding-top:calc(env(safe-area-inset-top) + 34vh);min-height:auto;align-items:start}}
.hero>*{min-width:0}
.hero h1{margin:16px 0 0;font:800 clamp(52px,6.2vw,88px)/.92 var(--display);letter-spacing:-.055em}
.hero .lead{margin:22px 0 0;font-size:clamp(17px,1.5vw,20px);line-height:1.5;color:var(--muted);max-width:520px}
.ver{display:inline-flex;align-items:center;gap:10px;margin-top:24px;padding:10px 16px 10px 12px;border-radius:999px;font-size:14px;color:rgba(245,245,247,.86)}
.ver i{width:8px;height:8px;border-radius:50%;background:#fff;box-shadow:0 0 0 0 rgba(255,255,255,.6);animation:ping 2.4s var(--ease) infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(255,255,255,.55)}70%,100%{box-shadow:0 0 0 10px rgba(255,255,255,0)}}

.panel{border-radius:34px;padding:clamp(18px,2.2vw,26px)}
.btn{position:relative;display:flex;align-items:center;justify-content:center;gap:10px;min-height:62px;padding:0 24px;border-radius:22px;font:650 17px var(--body);letter-spacing:-.01em;border:0;cursor:pointer;color:#fff;
 transition:transform .35s var(--ease),background-color .25s;overflow:hidden;text-align:center}
.btn svg{width:20px;height:20px;flex:none}
.btn span{position:relative;z-index:1}
.btn:active{transform:scale(.97)}
.btn.white{background:#fff;color:#000;box-shadow:0 14px 44px rgba(255,255,255,.14)}
.btn.white:hover{background:#ececef}
.btn.white::after{content:"";position:absolute;top:0;bottom:0;width:40%;left:-60%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.85),transparent);transform:skewX(-18deg);animation:sheen 4.5s var(--ease) 1.4s infinite}
@keyframes sheen{0%{left:-60%}35%,100%{left:130%}}
.btn.glass{background:var(--glass)}
.btn.glass:hover{background:var(--glass-2)}
.btns{display:grid;gap:10px}
.btns .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btns .two .btn{font-size:15px;padding:0 14px}
@media (max-width:380px){.btns .two{grid-template-columns:1fr}}
.src{margin-top:16px;padding-top:16px;border-top:1px solid rgba(255,255,255,.08)}
.src .lbl{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin-bottom:10px}
.srcrow{display:flex;gap:8px;align-items:center}
.srcrow code{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font:13px var(--mono);color:rgba(255,255,255,.82);background:rgba(0,0,0,.35);padding:13px 14px;border-radius:14px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.07)}
.copy{flex:none;background:#fff;color:#000;border:0;border-radius:14px;padding:12px 16px;font:650 14px var(--body);cursor:pointer;min-width:110px;transition:transform .2s var(--ease)}
.copy:active{transform:scale(.96)}
.manual{margin:14px 0 0;padding:0;list-style:none;counter-reset:s;display:grid;gap:10px}
.manual li{counter-increment:s;display:flex;gap:12px;align-items:flex-start;color:var(--muted);font-size:15px;line-height:1.45}
.manual li::before{content:counter(s);flex:none;width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#000;background:rgba(255,255,255,.88);margin-top:1px}
.manual b{color:#fff;font-weight:600}

/* steps */
.sec{padding:clamp(70px,12vh,140px) 0 0}
.timeline{position:relative;margin-top:44px;display:grid;gap:16px;padding-left:44px}
.timeline .rail{position:absolute;left:15px;top:22px;bottom:22px;width:2px;background:rgba(255,255,255,.1);border-radius:2px;overflow:hidden}
.timeline .rail i{position:absolute;left:0;top:0;width:100%;height:var(--fill,0%);background:linear-gradient(#fff,#c9bfff,#a5e4ff)}
.step{border-radius:26px;padding:22px 24px;position:relative}
.step .dot{position:absolute;left:-44px;top:20px;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font:700 14px var(--body);color:#fff;background:#111;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.3);transition:background-color .4s,color .4s,box-shadow .4s}
.step.lit .dot{background:#fff;color:#000;box-shadow:0 0 0 6px rgba(255,255,255,.08),0 0 30px rgba(200,190,255,.6)}
.step h3{margin:0 0 6px;font:700 clamp(21px,2vw,26px)/1.15 var(--display);letter-spacing:-.025em}
.step p{margin:0;color:var(--muted);font-size:15px;line-height:1.5}
.step a.ext{display:inline-flex;align-items:center;gap:6px;margin-top:12px;font-weight:600;font-size:14px;color:#fff;padding:8px 14px;border-radius:999px;background:rgba(255,255,255,.08);box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}

/* files */
.files{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:44px}
@media (max-width:700px){.files{grid-template-columns:1fr}}
.file{border-radius:28px;padding:26px;display:flex;flex-direction:column;gap:12px;transform:perspective(900px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .5s var(--ease)}
.file .top{display:flex;align-items:center;justify-content:space-between}
.file .badge{font:700 12px var(--mono);letter-spacing:.1em;padding:7px 12px;border-radius:999px;background:rgba(255,255,255,.1)}
.file .size{font:13px var(--mono);color:var(--faint)}
.file h3{margin:6px 0 0;font:700 28px/1.1 var(--display);letter-spacing:-.03em}
.file p{margin:0;color:var(--muted);font-size:15px;line-height:1.5;flex:1}
.file .name{font:12px var(--mono);color:var(--faint);word-break:break-all}
.file .btn{min-height:52px;border-radius:18px;font-size:15px}

/* faq */
.faq{margin-top:40px;display:grid;gap:10px}
.qa{border-radius:22px;overflow:hidden}
.qa button{width:100%;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:20px 22px;background:none;border:0;color:#fff;font:600 17px/1.3 var(--body);text-align:left;cursor:pointer}
.qa .pm{flex:none;width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.08);position:relative;transition:transform .5s var(--ease),background-color .3s}
.qa .pm::before,.qa .pm::after{content:"";position:absolute;left:50%;top:50%;width:12px;height:2px;margin:-1px 0 0 -6px;border-radius:1px;background:#fff}
.qa .pm::after{transform:rotate(90deg);transition:transform .5s var(--ease)}
.qa.open .pm{transform:rotate(180deg);background:#fff}.qa.open .pm::before,.qa.open .pm::after{background:#000}.qa.open .pm::after{transform:rotate(0)}
.qa .ans{display:grid;grid-template-rows:0fr;transition:grid-template-rows .55s var(--ease)}
.qa.open .ans{grid-template-rows:1fr}
.qa .ans>div{overflow:hidden}
.qa .ans p{margin:0;padding:0 22px 20px;color:var(--muted);font-size:15px;line-height:1.55}

footer{position:relative;z-index:3;margin-top:clamp(80px,12vh,140px);padding:36px clamp(16px,5vw,64px) calc(env(safe-area-inset-bottom) + 36px);border-top:1px solid rgba(255,255,255,.08);color:var(--faint);font-size:13px;line-height:1.6;display:flex;gap:20px;justify-content:space-between;flex-wrap:wrap}
footer a{color:var(--muted)}footer a:hover{color:#fff}
footer .fl{display:flex;gap:18px;flex-wrap:wrap}

.rv{opacity:0;transform:translateY(36px);transition:opacity 1s var(--ease),transform 1.1s var(--ease)}
.rv.shown{opacity:1;transform:none}
.d1{transition-delay:.08s}.d2{transition-delay:.16s}.d3{transition-delay:.24s}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 24px);transform:translate(-50%,20px);opacity:0;z-index:60;padding:12px 18px;border-radius:16px;font-size:15px;font-weight:600;transition:opacity .25s ease,transform .35s var(--ease);white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){.grain,.ver i,.btn.white::after{animation:none}.rv{opacity:1;transform:none;transition:none}}

/* ---- soft page transitions ---- */
@view-transition{navigation:auto}
::view-transition-old(root){animation:pt-old .45s cubic-bezier(.4,0,.2,1) both}
::view-transition-new(root){animation:pt-new .7s cubic-bezier(.16,1,.3,1) both}
::view-transition-group(astra-logo){animation-duration:.7s;animation-timing-function:cubic-bezier(.16,1,.3,1)}
@keyframes pt-old{to{opacity:0;transform:scale(.97);filter:blur(10px)}}
@keyframes pt-new{from{opacity:0;transform:scale(1.03);filter:blur(10px)}}
html.pt-fb body{animation:pt-in .7s cubic-bezier(.16,1,.3,1) both}
html.pt-out body{opacity:0;filter:blur(10px);transition:opacity .38s cubic-bezier(.4,0,.2,1),filter .38s cubic-bezier(.4,0,.2,1)}
@keyframes pt-in{from{opacity:0;filter:blur(10px)}}
@media (prefers-reduced-motion:reduce){::view-transition-old(root),::view-transition-new(root),::view-transition-group(astra-logo){animation:none}html.pt-fb body{animation:none}html.pt-out body{transition:none}}
</style>
<script>
/* Soft transitions between AstraGram pages. Browsers with cross-document View Transitions (Safari 18.2+, Chrome 126+)
   animate natively from the CSS; older ones get a fade out on leaving and a fade in on arrival. */
(function(){
 var native='PageRevealEvent' in window, reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
 if(native||reduce)return;
 var root=document.documentElement;root.classList.add('pt-fb');
 document.addEventListener('click',function(e){
  var a=e.target.closest&&e.target.closest('a');if(!a||a.target||e.defaultPrevented||e.button||e.metaKey||e.ctrlKey||e.shiftKey||e.altKey)return;
  var u;try{u=new URL(a.href,location.href)}catch(_){return}
  if(u.origin!==location.origin||u.pathname.indexOf('/astragram')!==0&&location.pathname.indexOf('/astragram')===0)return;
  if(u.pathname===location.pathname&&u.search===location.search)return; // same page: anchors scroll
  e.preventDefault();root.classList.add('pt-out');setTimeout(function(){location.href=u.href},380);
 });
 addEventListener('pageshow',function(){root.classList.remove('pt-out')});
})();
</script>
</head>
<body>
<canvas id="gl" aria-hidden="true"></canvas>
<div id="glFallback" aria-hidden="true"></div>
<div class="vignette" aria-hidden="true"></div>
<div class="grain" aria-hidden="true"></div>

<nav class="glass">
 <a class="brand" href="../"><img src="../icon.png" alt="" style="view-transition-name:astra-logo">AstraGram</a>
 <div class="lang"><button class="lang-btn" id="langBtn" aria-haspopup="true" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.6 2.6 3.8 5.6 3.8 9s-1.2 6.4-3.8 9c-2.6-2.6-3.8-5.6-3.8-9S9.4 5.6 12 3z"/></svg><span id="langCur">RU</span></button>
  <div class="lang-menu glass" id="langMenu" role="menu"></div></div>
 <a class="gh" href="https://github.com/dedsec-reth0/astragram"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 .5a11.5 11.5 0 0 0-3.64 22.41c.58.1.79-.25.79-.56v-2c-3.2.7-3.88-1.37-3.88-1.37-.52-1.33-1.28-1.69-1.28-1.69-1.05-.71.08-.7.08-.7 1.16.08 1.77 1.19 1.77 1.19 1.03 1.77 2.7 1.26 3.36.96.1-.75.4-1.26.73-1.55-2.55-.29-5.24-1.28-5.24-5.69 0-1.26.45-2.29 1.19-3.1-.12-.29-.52-1.46.11-3.05 0 0 .97-.31 3.17 1.18a11 11 0 0 1 5.77 0c2.2-1.49 3.17-1.18 3.17-1.18.63 1.59.23 2.76.11 3.05.74.81 1.19 1.84 1.19 3.1 0 4.42-2.69 5.39-5.25 5.68.41.36.78 1.06.78 2.14v3.17c0 .31.21.67.8.56A11.5 11.5 0 0 0 12 .5z"/></svg><span>GitHub</span></a>
</nav>

<main>
 <section class="hero">
  <div>
   <div class="eyebrow rv" data-i="inst.eyebrow"></div>
   <h1 class="rv d1" data-i="inst.h1"></h1>
   <p class="lead rv d2" data-i="inst.lead"></p>
   <div class="ver glass rv d3"><i></i><span id="ver"></span></div>
  </div>
  <div class="panel glass rv d2">
   <div class="btns">
    <a class="btn white" id="alt" href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M5 21h14"/></svg><span data-i="inst.alt"></span></a>
    <div class="two">
     <a class="btn glass" id="side" href="#" data-i="inst.side"></a>
     <a class="btn glass" id="ipa" href="https://github.com/dedsec-reth0/astragram/releases/latest"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8l-9-5-9 5 9 5 9-5z"/><path d="M3 8v8l9 5 9-5V8"/><path d="M12 13v8"/></svg><span data-i="inst.ipa"></span></a>
    </div>
   </div>
   <div class="src">
    <div class="lbl" data-i="inst.src"></div>
    <div class="srcrow"><code id="srcurl"></code><button class="copy" id="copy" data-i="inst.copy"></button></div>
    <ol class="manual"><li><span data-i="inst.manual.0"></span></li><li><span data-i="inst.manual.1"></span></li><li><span data-i="inst.manual.2"></span></li></ol>
   </div>
  </div>
 </section>

 <section class="sec" id="steps">
  <div class="eyebrow rv" data-i="inst.stepsEyebrow"></div>
  <h2 class="h2 rv d1" data-i="inst.stepsH"></h2>
  <div class="timeline" id="timeline">
   <div class="rail"><i></i></div>
   <div class="step glass rv"><span class="dot">1</span><h3 data-i="inst.steps.0.0"></h3><p data-i="inst.steps.0.1"></p><a class="ext" href="https://altstore.io"><span data-i="inst.getAlt"></span> ↗</a></div>
   <div class="step glass rv"><span class="dot">2</span><h3 data-i="inst.steps.1.0"></h3><p data-i="inst.steps.1.1"></p></div>
   <div class="step glass rv"><span class="dot">3</span><h3 data-i="inst.steps.2.0"></h3><p data-i="inst.steps.2.1"></p></div>
  </div>
 </section>

 <section class="sec" id="files">
  <div class="eyebrow rv" data-i="inst.filesEyebrow"></div>
  <h2 class="h2 rv d1" data-i="inst.filesH"></h2>
  <div class="files">
   <div class="file glass rv"><div class="top"><span class="badge">IPA</span><span class="size" id="size0"></span></div><h3 data-i="inst.files.0.0"></h3><p data-i="inst.files.0.1"></p><div class="name" id="name0"></div><a class="btn white" id="dl0" href="https://github.com/dedsec-reth0/astragram/releases/latest" data-i="inst.dl"></a></div>
   <div class="file glass rv d1"><div class="top"><span class="badge">FULL</span><span class="size" id="size1"></span></div><h3 data-i="inst.files.1.0"></h3><p data-i="inst.files.1.1"></p><div class="name" id="name1"></div><a class="btn glass" id="dl1" href="https://github.com/dedsec-reth0/astragram/releases/latest" data-i="inst.dl"></a></div>
  </div>
 </section>

 <section class="sec" id="faq">
  <h2 class="h2 rv" data-i="inst.faqH"></h2>
  <div class="faq" id="faqList"></div>
 </section>
</main>

<footer>
 <div data-i="foot.text"></div>
 <div class="fl"><a href="../" data-i="inst.home"></a><a href="https://github.com/dedsec-reth0/astragram">GitHub</a><a href="https://t.me/astragram_news" data-i="foot.channel"></a></div>
</footer>
<div class="toast glass" id="toast"></div>

<script src="../i18n.js?v=3"></script>
<script src="../i18n-install.js?v=3"></script>
<script src="../scene.js?v=3"></script>
<script>
(function(){
 var SRC='https://github.com/dedsec-reth0/astragram/releases/download/sidestore-source/source.json';
 var $=function(s){return document.querySelector(s)};
 var enc=encodeURIComponent(SRC);
 $('#srcurl').textContent=SRC;
 $('#alt').href='altstore://source?url='+enc;
 $('#side').href='sidestore://source?url='+enc;

 /* ---- language ---- */
 var LANGS=['ru','en','uk','es','pt','de','fr','tr'],LANG='ru',D=I18N.ru,rel=null;
 function pick(){var q=new URLSearchParams(location.search).get('lang');if(q&&I18N[q])return q;
  try{var s=localStorage.getItem('astragram.lang');if(s&&I18N[s])return s}catch(e){}
  var nav=(navigator.languages||[navigator.language||'en']).map(function(l){return String(l).toLowerCase().slice(0,2)});
  for(var i=0;i<nav.length;i++){if(I18N[nav[i]])return nav[i];if(nav[i]==='be'||nav[i]==='kk')return 'ru'}return 'en'}
 function get(p){return p.split('.').reduce(function(o,k){return o==null?o:o[k]},D)}
 function apply(l){LANG=l;D=I18N[l];document.documentElement.lang=l;document.title=D.inst.title;
  document.querySelectorAll('[data-i]').forEach(function(el){var v=get(el.dataset.i);if(v!=null)el.innerHTML=v});
  $('#faqList').innerHTML=D.inst.faq.map(function(q,i){return '<div class="qa glass'+(i===0?' open':'')+'"><button aria-expanded="'+(i===0)+'"><span>'+q[0]+'</span><span class="pm"></span></button><div class="ans"><div><p>'+q[1]+'</p></div></div></div>'}).join('');
  $('#langCur').textContent=D.short;
  document.querySelectorAll('#langMenu button').forEach(function(b){b.classList.toggle('on',b.dataset.l===l)});
  showVer()}
 function showVer(){var m=rel&&(rel.name||'').match(/([\d.]+).*\((\d+)\)/);
  $('#ver').textContent=m?D.inst.ver.replace('{v}',m[1]).replace('{b}',m[2]).replace('{d}',new Date(rel.published_at).toLocaleDateString(LANG==='uk'?'uk-UA':LANG,{day:'numeric',month:'long'})):D.inst.verFb}
 var menu=$('#langMenu'),btn=$('#langBtn');
 menu.innerHTML=LANGS.map(function(l){return '<button role="menuitem" data-l="'+l+'"><b>'+I18N[l].short+'</b>'+I18N[l].name+'</button>'}).join('');
 function close(){menu.classList.remove('open');btn.setAttribute('aria-expanded','false')}
 btn.addEventListener('click',function(e){e.stopPropagation();var o=menu.classList.toggle('open');btn.setAttribute('aria-expanded',o?'true':'false')});
 menu.addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;try{localStorage.setItem('astragram.lang',b.dataset.l)}catch(_){}apply(b.dataset.l);close()});
 document.addEventListener('click',close);
 var first=pick();try{if(new URLSearchParams(location.search).get('lang'))localStorage.setItem('astragram.lang',first)}catch(e){}
 apply(first);

 /* ---- faq ---- */
 $('#faqList').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;var q=b.parentNode;var o=q.classList.toggle('open');b.setAttribute('aria-expanded',o?'true':'false')});

 /* ---- copy ---- */
 var toast=$('#toast'),tt;
 $('#copy').onclick=function(){var b=this;function ok(){b.textContent=D.inst.done;toast.textContent=D.inst.copied;toast.classList.add('show');clearTimeout(tt);tt=setTimeout(function(){b.textContent=D.inst.copy;toast.classList.remove('show')},1600)}
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(SRC).then(ok,function(){})}
  else{var t=document.createElement('textarea');t.value=SRC;t.setAttribute('readonly','');t.style.position='absolute';t.style.left='-9999px';document.body.appendChild(t);t.select();try{document.execCommand('copy');ok()}catch(e){}document.body.removeChild(t)}};

 /* ---- latest release: direct IPA links, sizes, version ---- */
 try{fetch('https://api.github.com/repos/dedsec-reth0/astragram/releases/latest').then(function(r){return r.ok?r.json():null}).then(function(j){
  if(!j)return;rel=j;showVer();
  var ipas=(j.assets||[]).filter(function(x){return /\.ipa$/.test(x.name)});
  var std=ipas.filter(function(x){return !/-full\.ipa$/.test(x.name)})[0],full=ipas.filter(function(x){return /-full\.ipa$/.test(x.name)})[0];
  [std,full].forEach(function(a,i){if(!a)return;$('#dl'+i).href=a.browser_download_url;$('#size'+i).textContent=Math.round(a.size/1048576)+' MB';$('#name'+i).textContent=a.name});
  if(std)$('#ipa').href=std.browser_download_url;
  if(location.hash==='#ipa'&&std)location.href=std.browser_download_url;
 }).catch(function(){})}catch(e){}
 // From the channel's AltStore button: offer to open AltStore at once (iOS asks "Open in AltStore?").
 if(location.hash==='#altstore')setTimeout(function(){location.href=$('#alt').href},450);

 /* ---- reveal + timeline ---- */
 var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add('shown');io.unobserve(e.target)}})},{threshold:.15});
 document.querySelectorAll('.rv').forEach(function(el){io.observe(el)});
 var tl=$('#timeline'),steps=[].slice.call(document.querySelectorAll('.step'));
 if(matchMedia('(pointer:fine)').matches){document.querySelectorAll('.file').forEach(function(el){el.addEventListener('pointermove',function(e){var r=el.getBoundingClientRect();el.style.setProperty('--ry',((e.clientX-r.left)/r.width-.5)*8+'deg');el.style.setProperty('--rx',(.5-(e.clientY-r.top)/r.height)*8+'deg')});el.addEventListener('pointerleave',function(){el.style.setProperty('--rx','0deg');el.style.setProperty('--ry','0deg')})})}

 /* ---- scene + loop ---- */
 var GL=window.AstraScene,reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
 var mouse={x:0,y:0},sm={x:0,y:0},cur=null,T0=performance.now(),tp=T0,vis=true;
 addEventListener('pointermove',function(e){mouse.x=e.clientX/innerWidth*2-1;mouse.y=-(e.clientY/innerHeight*2-1)},{passive:true});
 document.addEventListener('visibilitychange',function(){vis=!document.hidden;tp=performance.now()});
 function lerp(a,b,k){return a+(b-a)*k}
 function target(){var mob=innerWidth<=900;var max=Math.max(1,document.documentElement.scrollHeight-innerHeight);var k=Math.min(1,scrollY/max);
  var a=mob?{x:0,y:1.0,z:0,sc:.62,morph:1,rx:.3,ry:.5,dim:1}:{x:1.35,y:.15,z:0,sc:.95,morph:1,rx:.3,ry:.55,dim:1};
  var b=mob?{x:-.35,y:-.9,z:-1.4,sc:.5,morph:0,rx:0,ry:0,dim:.45}:{x:-1.9,y:-.55,z:-1.6,sc:.6,morph:0,rx:0,ry:0,dim:.45};
  var e=k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2,o={};for(var n in a)o[n]=lerp(a[n],b[n],e);return o}
 function frame(now){requestAnimationFrame(frame);if(!vis)return;var dt=Math.min(64,now-tp);tp=now;var t=(now-T0)/1000;
  var k=1-Math.pow(.003,dt/1000);sm.x+=(mouse.x-sm.x)*k;sm.y+=(mouse.y-sm.y)*k;
  var s=target();if(!cur)cur=s;var kk=1-Math.pow(.004,dt/1000);for(var n in s)cur[n]+=(s[n]-cur[n])*kk;
  if(GL)GL.draw({x:cur.x,y:cur.y,z:cur.z,sc:cur.sc,morph:cur.morph,rx:cur.rx+sm.y*.25,ry:cur.ry+sm.x*.3,dim:cur.dim,mx:sm.x,my:sm.y,spin:reduce?0:(cur.morph>.5?Math.sin(t*.4)*.35+sm.x*.35:t*.08)},reduce?0:t,dt);
  var r=tl.getBoundingClientRect();var f=Math.max(0,Math.min(1,(innerHeight*.65-r.top)/r.height));tl.style.setProperty('--fill',(f*100)+'%');
  steps.forEach(function(st){st.classList.toggle('lit',st.getBoundingClientRect().top<innerHeight*.65)})}
 requestAnimationFrame(frame);
})();
</script>
</body>
</html>
